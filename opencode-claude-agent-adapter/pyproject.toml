[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/opencode_claude_agent"]

[project]
name = "opencode-claude-agent-adapter"
version = "0.1.0"
description = "OpenCode adapter that bridges TUI with Claude Agent SDK"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.9.0",
    "python-multipart>=0.0.20",
    "sse-starlette>=2.1.3",
    "python-dotenv>=1.0.0",
    "claude-agent-sdk",
]

[project.scripts]
opencode-claude-agent = "opencode_claude_agent.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
