[project]
name = "opencode-tui-adapter"
version = "0.1.0"
description = "Backend adapter for OpenCode TUI with Claude Agent SDK"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sse-starlette>=2.2.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "claude-agent-sdk>=0.1.3",
    "structlog>=24.4.0",
    "python-multipart>=0.0.20",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.27.0",
    "httpx-sse>=0.4.0",
    "black>=24.10.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[project.scripts]
opencode-tui-adapter = "opencode_tui_adapter.server:main"
helios = "opencode_tui_adapter.helios:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.ruff]
line-length = 100
target-version = "py313"

[build-system]
requires = ["uv_build>=0.9.2,<0.10.0"]
build-backend = "uv_build"
